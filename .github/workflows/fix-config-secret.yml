name: Fix Douyin Config Secret

# 一次性修复：把搜不到的好友名（emoji 变体 / 备注名）用实测可用的写法写回 DOUYIN_CONFIG。
# 候选名见 config/fixes.json，只有真正能打开聊天的写法才会被采用。
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      secrets: write
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      HEADLESS: "true"
      TRACE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Repair friend names
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fix_config_secret.py
      - name: Write corrected config back to Secret
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f artifacts/corrected-config.json ]; then
            gh secret set DOUYIN_CONFIG --body-file artifacts/corrected-config.json -R "$GITHUB_REPOSITORY"
            echo "DOUYIN_CONFIG 已更新"
          else
            echo "未生成修正配置，跳过写入"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-config-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
