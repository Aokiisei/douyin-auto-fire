name: Repair Friend Names

# 诊断 + 修正：用生产代码路径实测候选好友名，找出真正能打开聊天的写法。
# 结果输出到日志（REPLACEMENTS 行）与 artifacts/corrected-config.json，
# 便于把结论固化进 config/fixes.json。本工作流不修改任何 Secret。
on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      HEADLESS: "true"
      TRACE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Repair friend names
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fix_config_secret.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-config-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
