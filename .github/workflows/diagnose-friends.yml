name: Diagnose Douyin Friends

# 手动触发：排查 DOUYIN_CONFIG 中搜索不到的好友，抓取真实昵称。
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      HEADLESS: "true"
      TRACE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Diagnose friends
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/diagnose_friends.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friend-report-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
